<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Memory Mesh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --swarm: #e67e22; --arkiv: #16a085;
  }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.2rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  #head { font-size: 0.85rem; color: #888; font-variant-numeric: tabular-nums; }
  .sub { color: #888; margin-bottom: 1rem; font-size: 0.9rem; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; }
  legend { font-weight: 600; padding: 0 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
  .tag { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.03em; padding: 0.1rem 0.4rem; border-radius: 4px; color: #fff; }
  .tag.swarm { background: var(--swarm); }
  .tag.arkiv { background: var(--arkiv); }
  label { display: block; margin: 0.5rem 0 0.2rem; font-size: 0.85rem; }
  input, select, textarea, button { font: inherit; padding: 0.4rem; border-radius: 6px; border: 1px solid #8886; width: 100%; box-sizing: border-box; }
  button { cursor: pointer; font-weight: 600; margin-top: 0.8rem; width: auto; padding: 0.5rem 1.2rem; }
  button.small { font-weight: 400; padding: 0.3rem 0.7rem; margin-top: 0; }
  .row { display: flex; gap: 1rem; }
  .row > div { flex: 1; }
  .cols { display: flex; gap: 1.2rem; }
  .cols > fieldset { flex: 1; min-width: 0; }
  #status { font-size: 0.85rem; color: #888; min-height: 1.2em; margin-top: 0.4rem; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #8883; vertical-align: top; }
  th { color: #888; font-weight: 500; }
  .content { max-width: 220px; word-break: break-word; }
  .content.failed, .warn { color: #e67e22; }
  .content.failed { font-style: italic; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #888; margin-right: 0.4rem; }
  .live-dot.on { background: #2ecc71; }
  code, .mono { font-size: 0.8em; font-family: ui-monospace, monospace; }
  a.proof { text-decoration: none; margin-right: 0.5rem; }
  a.proof:hover { text-decoration: underline; }
  #log { height: 160px; overflow-y: auto; font-size: 0.78rem; font-family: ui-monospace, monospace; background: #8881; border-radius: 6px; padding: 0.5rem; }
  #log div { padding: 0.1rem 0; border-bottom: 1px dashed #8882; }
  #log .ignored { opacity: 0.5; }
  #log .phase-resolved, #log .phase-memory { color: #16a085; }
</style>
</head>
<body>

<header>
  <h1>Agent Memory Mesh</h1>
  <div id="head">Tiramisu block: —</div>
</header>
<div class="sub">Content: Swarm (encrypted) &middot; Index: Arkiv (Tiramisu, expiring)</div>

<div class="cols">
  <fieldset>
    <legend>Write a memory <span class="tag swarm">SWARM</span><span class="tag arkiv">ARKIV</span></legend>
    <div class="row">
      <div>
        <label>Agent</label>
        <select id="agentId">
          <option value="atlas">atlas</option>
          <option value="nova">nova</option>
        </select>
      </div>
      <div>
        <label>Memory type</label>
        <select id="memoryType">
          <option>preference</option>
          <option>fact</option>
          <option>task</option>
          <option>event</option>
          <option>claim</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Tag</label>
        <input id="tag" value="ui">
      </div>
      <div>
        <label>Importance (0-10)</label>
        <input id="importance" type="number" min="0" max="10" value="7">
      </div>
      <div>
        <label>Lifetime (blocks, ~2s each)</label>
        <input id="ttlBlocks" type="number" min="1" value="600">
      </div>
    </div>
    <label>What the agent remembers</label>
    <textarea id="content" rows="2">the user prefers dark mode and 24-hour time</textarea>
    <button id="writeBtn">Write memory</button>
    <div id="status"></div>
  </fieldset>

  <fieldset>
    <legend><span id="liveDot" class="live-dot"></span>Live feed <span class="tag arkiv">ARKIV</span></legend>
    <table>
      <thead><tr><th>agent</th><th>type</th><th>tag</th><th>imp.</th><th>content</th><th>proof</th></tr></thead>
      <tbody id="liveRows"></tbody>
    </table>
  </fieldset>
</div>

<fieldset>
  <legend>Event log</legend>
  <div id="log"></div>
</fieldset>

<script>
const $ = (id) => document.getElementById(id)
const SWARM_GATEWAY = 'https://api.gateway.ethswarm.org'
const EXPLORER = 'https://tiramisu.explorer.arkiv.network'
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
// Only ever interpolated into logLine's innerHTML, and its inputs come off-chain, so it escapes.
const short = (s) => s ? esc(String(s).slice(0, 10)) + '…' : ''

// Every value here is attacker-controlled: swarm_ref is a chain attribute and anyone can write
// an entity claiming any agent_id. Escape after URL-encoding, or a crafted attribute breaks out
// of the href and executes in every viewer's feed.
const url = (s) => esc(encodeURIComponent(String(s ?? '')))

function proofLinks({ key, owner, swarmRef }) {
  const parts = []
  if (key) parts.push(`<a class="proof mono" target="_blank" href="${EXPLORER}/entity/${url(key)}">key ↗</a>`)
  if (owner) parts.push(`<a class="proof mono" target="_blank" href="${EXPLORER}/address/${url(owner)}">owner ↗</a>`)
  if (swarmRef) parts.push(`<a class="proof mono" target="_blank" href="${SWARM_GATEWAY}/bytes/${url(swarmRef)}">swarm ↗</a>`)
  return parts.join('')
}

function logLine(html, cls) {
  const div = document.createElement('div')
  if (cls) div.className = cls
  div.innerHTML = html
  $('log').prepend(div)
  while ($('log').children.length > 100) $('log').lastChild.remove()
}

async function pollHead() {
  try {
    const res = await fetch('/api/head')
    if (!res.ok) throw new Error(`/api/head → ${res.status}`)
    const { head: h } = await res.json()
    $('head').textContent = `Tiramisu block: ${h}`
    $('head').classList.remove('warn')
  } catch (e) {
    // Silently swallowing this made a deploy with no ARKIV_PRIVATE_KEY look like a working one
    // with no traffic.
    $('head').textContent = `Tiramisu block: unreachable (${e.message})`
    $('head').classList.add('warn')
  }
}
pollHead()
setInterval(pollHead, 2000)

$('writeBtn').onclick = async () => {
  $('status').textContent = 'writing...'
  const agentId = $('agentId').value
  logLine(`<b>${esc(agentId)}</b> → POST /api/memory`)
  try {
    const body = {
      agentId,
      memoryType: $('memoryType').value,
      tag: $('tag').value,
      importance: Number($('importance').value),
      content: { note: $('content').value },
      ttlBlocks: Number($('ttlBlocks').value),
    }
    const res = await fetch('/api/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || res.statusText)
    const ttl = data.ttlClamped
      ? `<span class="warn">requested ${esc(data.requestedTtlBlocks)} blocks, clamped to ${esc(data.appliedTtlBlocks)} by DEMO_MAX_TTL_BLOCKS</span>`
      : `requested ${esc(data.requestedTtlBlocks)} blocks`
    $('status').innerHTML = `written: ${proofLinks({ key: data.entityKey, swarmRef: data.swarmRef })}` +
      `<a class="proof mono" target="_blank" href="${EXPLORER}/tx/${url(data.txHash)}">tx ↗</a>` +
      `${ttl}, applied expiry block ${esc(data.appliedExpiresAt)}`
    logLine(`✓ entity created ${short(data.entityKey)}, applied expiry block ${data.appliedExpiresAt}`, 'phase-memory')
  } catch (e) {
    $('status').textContent = 'FAILED: ' + e.message
    logLine(`✕ write failed: ${esc(e.message)}`, 'ignored')
  }
}

function renderRow(a, content, proof) {
  const tr = document.createElement('tr')
  // A Swarm download failure must not render as an ordinary row, or a fully broken content leg
  // still produces a full-looking feed.
  const failed = Boolean(content?.error)
  const contentText = failed ? content.error : (content?.note ?? JSON.stringify(content))
  tr.innerHTML = `<td>${esc(a.agent_id)}</td><td>${esc(a.memory_type)}</td><td>${esc(a.tag)}</td><td>${esc(a.importance)}</td><td class="content${failed ? ' failed' : ''}">${esc(contentText)}</td><td>${proof}</td>`
  return tr
}

const seenKeys = new Set()
function addLiveRow(attrs, content, key, owner) {
  if (key) {
    if (seenKeys.has(key)) return
    seenKeys.add(key)
  }
  const row = renderRow(attrs, content, proofLinks({ key, owner, swarmRef: attrs?.swarm_ref }))
  $('liveRows').prepend(row)
}

let usingFallback = false
function startPollingFallback() {
  if (usingFallback) return
  usingFallback = true
  $('liveDot').classList.add('on')
  $('liveDot').title = 'polling /api/recent (no persistent websocket on this deployment)'
  async function poll() {
    try {
      const rows = await (await fetch('/api/recent')).json()
      let added = 0
      for (const r of rows) {
        if (seenKeys.has(r.key)) continue
        addLiveRow(r.attributes, r.content, r.key, r.owner)
        added++
      }
      if (added) logLine(`polled /api/recent → ${added} new`)
    } catch {}
  }
  poll()
  setInterval(poll, 3000)
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws'
let ws
try {
  ws = new WebSocket(`${proto}://${location.host}/live`)
  const connectTimeout = setTimeout(startPollingFallback, 2500)
  ws.onopen = () => { clearTimeout(connectTimeout); $('liveDot').classList.add('on'); $('liveDot').title = 'live websocket subscription' }
  ws.onclose = () => { $('liveDot').classList.remove('on'); startPollingFallback() }
  ws.onerror = () => startPollingFallback()
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data)
    // The chain subscription can die while our own socket to the server stays open. Without
    // this the dot stays green and the fallback never fires — the page looks live and is dead.
    if (msg.type === 'watch_error') {
      logLine(`✕ chain subscription lost: ${esc(msg.message)} — falling back to polling`, 'ignored')
      $('liveDot').classList.remove('on')
      startPollingFallback()
      return
    }
    if (msg.type === 'log') {
      if (msg.phase === 'event') logLine(`⚡ EntityCreated event, owner ${short(msg.owner)}`)
      else if (msg.phase === 'ignored') logLine(`✕ ignored ${short(msg.entityKey)} (not agent_memory)`, 'ignored')
      else if (msg.phase === 'resolved') logLine(`↳ resolved agent_memory, fetching Swarm content…`, 'phase-resolved')
      else if (msg.phase === 'error') logLine(`✕ getEntity failed for ${short(msg.entityKey)} (expired or transient)`, 'ignored')
      return
    }
    if (msg.type !== 'memory') return
    logLine(`✓ content decrypted from Swarm, rendering`, 'phase-memory')
    addLiveRow(msg.attributes, msg.content, msg.key, msg.owner)
  }
} catch {
  startPollingFallback()
}

</script>
</body>
</html>
