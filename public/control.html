<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydra · Control Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --swarm: #e67e22; --arkiv: #16a085; --ok: #2ecc71; --bad: #e74c3c; --muted: #888; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin: 0; }
  #head { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
  button { font: inherit; font-weight: 600; padding: 0.45rem 1rem; border-radius: 6px; border: 1px solid #8886; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  .dcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .dc { border: 1px solid #8884; border-radius: 8px; padding: 1rem; }
  .dc.down { opacity: 0.45; }
  .dc h2 { font-size: 1rem; margin: 0 0 0.5rem; }
  .rack { display: flex; gap: 4px; margin: 0.5rem 0; }
  .rack span { width: 18px; height: 18px; border-radius: 3px; background: var(--ok); }
  .rack span.failed { background: var(--bad); }
  .dc.down .rack span { background: var(--muted); }
  .agent { font-size: 0.9rem; margin-bottom: 0.6rem; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .dot.busy { background: var(--swarm); }
  .dot.dead { background: var(--bad); }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; }
  legend { font-weight: 600; padding: 0 0.4rem; }
  .tag { font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 4px; color: #fff; }
  .tag.swarm { background: var(--swarm); }
  .tag.arkiv { background: var(--arkiv); }
  #timeline { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; }
  #timeline li { padding: 0.3rem 0; border-bottom: 1px dashed #8883; }
  #timeline time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 0.5rem; }
  .mono { font-family: ui-monospace, monospace; font-size: 0.8em; word-break: break-all; }
  #phase { word-break: normal; overflow-wrap: anywhere; }
  .denied { color: var(--bad); font-weight: 600; }
  pre { background: #8881; padding: 0.6rem; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
  a { color: inherit; }
  .hydra { --ink: #1a1a1a; --paper: #fff; display: block; width: 100%; max-width: 600px; margin: 1rem auto 0; color: var(--ink); }
  @media (prefers-color-scheme: dark) { .hydra { --ink: #e8e8e8; --paper: #121212; } }
  .hydra .flesh { fill: var(--ink); stroke: none; }
  .hydra .neckline { fill: none; stroke: currentColor; stroke-width: 22; stroke-linecap: round; }
  .hydra text { fill: currentColor; font-size: 14px; font-weight: 600; text-anchor: middle; }
  .hydra .eye { fill: var(--paper); }
  .hydra .pupil { fill: var(--swarm); }
  .hydra .head { transform-box: fill-box; transform-origin: 50% 100%; }
  .hydra .stump { fill: var(--bad); opacity: 0; }
  .hydra .slash { stroke: var(--bad); stroke-width: 4; stroke-linecap: round; opacity: 0; }
  .neck.dead .head { opacity: 0; }
  .neck.dead .stump { opacity: 1; }
  .neck.cut .head { animation: head-cut 0.9s ease-in; }
  .neck.cut .stump { animation: stump-in 0.9s; }
  .neck.cut .slash { animation: slash 0.35s; }
  .neck.regrow .head { animation: head-regrow 1.2s ease-out; }
  .neck.regrow .stump { animation: stump-out 0.4s; }
  @keyframes head-cut {
    0% { transform: none; opacity: 1; }
    30% { transform: translateY(-4px) rotate(-8deg); opacity: 1; }
    100% { transform: translate(20px, 80px) rotate(60deg); opacity: 0; }
  }
  @keyframes stump-in { 0%, 50% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes stump-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes slash { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes head-regrow {
    0% { transform: scale(0); filter: none; }
    60% { transform: scale(1.15); filter: drop-shadow(0 0 8px var(--ok)); }
    100% { transform: scale(1); filter: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Hydra · Control Room</h1>
  <div id="head">Tiramisu block: —</div>
</header>
<div class="sub">Incident coordination on Arkiv &middot; incident reports encrypted on Swarm</div>

<button id="startBtn">Simulate rack failure in DC-1</button>
<span id="phase" class="mono"></span>

<svg class="hydra" viewBox="0 0 600 270" role="img" aria-label="Hydra: one head per agent">
  <ellipse class="flesh" cx="300" cy="235" rx="130" ry="30"/>
  <g class="neck" data-agent="atlas">
    <path class="neckline" d="M250 225 C 210 195, 110 195, 120 120"/>
    <text x="120" y="60">atlas</text>
    <g transform="translate(120 120) scale(-1 1)">
      <ellipse class="stump" rx="12" ry="5"/>
      <g class="head">
        <ellipse class="flesh" cx="4" cy="-14" rx="24" ry="18"/>
        <path class="flesh" d="M10 -24 L48 -15 L46 -3 L10 -2 Z"/>
        <path class="flesh" d="M-8 -28 L-20 -48 L2 -31 Z"/>
        <circle class="eye" cx="14" cy="-18" r="4.5"/>
        <circle class="pupil" cx="15" cy="-18" r="2.2"/>
      </g>
      <line class="slash" x1="-22" y1="10" x2="22" y2="-8"/>
    </g>
  </g>
  <g class="neck" data-agent="nova">
    <path class="neckline" d="M300 215 C 300 175, 300 135, 300 95"/>
    <text x="300" y="35">nova</text>
    <g transform="translate(300 95)">
      <ellipse class="stump" rx="12" ry="5"/>
      <g class="head">
        <ellipse class="flesh" cx="4" cy="-14" rx="24" ry="18"/>
        <path class="flesh" d="M10 -24 L48 -15 L46 -3 L10 -2 Z"/>
        <path class="flesh" d="M-8 -28 L-20 -48 L2 -31 Z"/>
        <circle class="eye" cx="14" cy="-18" r="4.5"/>
        <circle class="pupil" cx="15" cy="-18" r="2.2"/>
      </g>
      <line class="slash" x1="-22" y1="10" x2="22" y2="-8"/>
    </g>
  </g>
  <g class="neck" data-agent="sol">
    <path class="neckline" d="M350 225 C 390 195, 490 195, 480 120"/>
    <text x="480" y="60">sol</text>
    <g transform="translate(480 120)">
      <ellipse class="stump" rx="12" ry="5"/>
      <g class="head">
        <ellipse class="flesh" cx="4" cy="-14" rx="24" ry="18"/>
        <path class="flesh" d="M10 -24 L48 -15 L46 -3 L10 -2 Z"/>
        <path class="flesh" d="M-8 -28 L-20 -48 L2 -31 Z"/>
        <circle class="eye" cx="14" cy="-18" r="4.5"/>
        <circle class="pupil" cx="15" cy="-18" r="2.2"/>
      </g>
      <line class="slash" x1="-22" y1="10" x2="22" y2="-8"/>
    </g>
  </g>
</svg>

<div class="dcs" id="dcs"></div>

<fieldset>
  <legend>Incident timeline <span class="tag arkiv">ARKIV</span></legend>
  <ul id="timeline"></ul>
</fieldset>

<fieldset>
  <legend>Incident report <span class="tag swarm">SWARM</span></legend>
  <div id="reportRef" class="mono">No incident filed yet.</div>
  <div style="margin-top: 0.6rem">
    <button id="openSol" disabled>Open as Sol (on the roster)</button>
    <button id="openOutsider" disabled>Open as an outsider</button>
  </div>
  <div id="reportOut"></div>
</fieldset>

<script src="swarm-chunk.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const EXPLORER = 'https://tiramisu.explorer.arkiv.network'
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const url = (s) => esc(encodeURIComponent(String(s ?? '')))
const AGENTS = ['atlas', 'nova', 'sol']
const FAILED_SLOT = 4

let state = null

function dotClass(status) {
  if (status === 'dead' || status === 'error') return 'dead'
  if (status === 'working' || status === 'claiming') return 'busy'
  if (status === 'idle') return ''
  return 'live'
}

const lastAlive = {}

function renderHydra() {
  for (const id of AGENTS) {
    const alive = state.agents[id].alive
    const prev = lastAlive[id]
    if (prev === alive) continue
    lastAlive[id] = alive
    const neck = document.querySelector(`.neck[data-agent="${id}"]`)
    neck.classList.toggle('dead', !alive)
    neck.classList.remove('cut', 'regrow')
    if (prev === undefined) continue
    void neck.getBoundingClientRect()
    neck.classList.add(alive ? 'regrow' : 'cut')
  }
}

function render() {
  if (!state) return
  renderHydra()
  $('phase').textContent = state.tag ? ` ${state.tag} · ${state.phase}` : ''

  $('dcs').innerHTML = AGENTS.map((id) => {
    const a = state.agents[id]
    const rackFailed = id === 'atlas' && state.phase === 'running' && state.report
    const slots = Array.from({ length: 8 }, (_, i) => `<span class="${rackFailed && i === FAILED_SLOT ? 'failed' : ''}"></span>`).join('')
    const canKill = a.alive && state.phase !== 'idle'
    return `<div class="dc${a.alive ? '' : ' down'}">
      <h2>${esc(a.dc)}</h2>
      <div class="rack">${slots}</div>
      <div class="agent"><span class="dot ${dotClass(a.status)}"></span><b>${esc(id)}</b> · ${esc(a.status)}</div>
      <button data-kill="${esc(id)}" ${canKill ? '' : 'disabled'}>Cut power</button>
    </div>`
  }).join('')

  $('timeline').innerHTML = state.timeline.map((e) =>
    `<li><time>${esc(new Date(e.at).toLocaleTimeString())}</time><b>${esc(e.agentId)}</b> ${esc(e.text)}</li>`
  ).join('')

  if (state.report) {
    $('reportRef').innerHTML =
      `Swarm ref <a data-swarm-ref="${esc(state.report.swarmRef)}" href="${esc(swarmChunkUrl(state.report.swarmRef))}">${esc(state.report.swarmRef)}</a><br>` +
      `Arkiv entity <a target="_blank" rel="noopener" href="${EXPLORER}/entity/${url(state.report.entityKey)}">${esc(state.report.entityKey)}</a>` +
      (state.receiptRef ? `<br>Public receipt <a target="_blank" rel="noopener" href="${esc(swarmFileUrl(state.receiptRef))}">open on Swarm ↗</a>` : '')
    $('openSol').disabled = false
    $('openOutsider').disabled = false
  } else {
    $('reportRef').textContent = 'No incident filed yet.'
    $('openSol').disabled = true
    $('openOutsider').disabled = true
  }
}

function getStoredPassword() {
  try { return sessionStorage.getItem('demoPassword') || '' } catch { return '' }
}

function setStoredPassword(pw) {
  try { sessionStorage.setItem('demoPassword', pw) } catch {}
}

function clearStoredPassword() {
  try { sessionStorage.removeItem('demoPassword') } catch {}
}

async function post(path) {
  const attempt = async () => {
    const res = await fetch(path, { method: 'POST', headers: { 'x-demo-password': getStoredPassword() } })
    const data = await res.json()
    return { res, data }
  }
  let { res, data } = await attempt()
  if (res.status === 401) {
    const pw = prompt('Demo password:')
    if (pw) {
      setStoredPassword(pw)
      ;({ res, data } = await attempt())
    }
  }
  if (!res.ok) {
    if (res.status === 401) clearStoredPassword()
    throw new Error(data.error || res.statusText)
  }
  state = data.state
  render()
}

$('startBtn').onclick = async () => {
  $('startBtn').disabled = true
  $('reportOut').textContent = ''
  try {
    await post('/api/demo/start')
  } catch (e) {
    alert(`start failed: ${e.message}`)
  } finally {
    $('startBtn').disabled = false
  }
}

$('dcs').onclick = async (ev) => {
  const id = ev.target.dataset?.kill
  if (!id) return
  try {
    await post(`/api/demo/kill/${encodeURIComponent(id)}`)
  } catch (e) {
    alert(`cut power failed: ${e.message}`)
  }
}

async function openReport(as) {
  $('reportOut').textContent = 'downloading from Swarm…'
  try {
    const res = await fetch(`/api/demo/report?as=${encodeURIComponent(as)}`)
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || res.statusText)
    if (data.ok) {
      $('reportOut').innerHTML = `<p>Decrypted with <b>${esc(data.as)}</b>'s key (${esc(data.bytes)} bytes from Swarm):</p><pre>${esc(JSON.stringify(data.report, null, 2))}</pre>`
    } else {
      $('reportOut').innerHTML = `<p class="denied">${esc(data.error)}</p><p>What the gateway or anyone else sees (${esc(data.bytes)} bytes):</p><pre>${esc(data.ciphertextPreview)}…</pre>`
    }
  } catch (e) {
    $('reportOut').textContent = `FAILED: ${e.message}`
  }
}
$('reportRef').onclick = async (ev) => {
  const link = ev.target.closest('a[data-swarm-ref]')
  if (!link) return
  ev.preventDefault()
  $('reportOut').textContent = 'fetching from the Swarm gateway…'
  try {
    const chunk = await fetchSwarmChunk(link.dataset.swarmRef)
    $('reportOut').innerHTML = `<p>Fetched by your browser straight from <b>${esc(chunk.host)}</b>: ${esc(chunk.bytes)} bytes, encrypted. Nobody can read it without a key on the incident's roster.</p><pre>${esc(chunk.hex)}${chunk.truncated ? '…' : ''}</pre>`
  } catch (e) {
    $('reportOut').textContent = `FAILED: ${e.message}`
  }
}
$('openSol').onclick = () => openReport('sol')
$('openOutsider').onclick = () => openReport('outsider')

async function loadState() {
  try {
    state = await (await fetch('/api/demo/state')).json()
    render()
  } catch {}
}

async function pollHead() {
  try {
    const res = await fetch('/api/head')
    if (!res.ok) throw new Error(`/api/head → ${res.status}`)
    const { head } = await res.json()
    $('head').textContent = `Tiramisu block: ${head}`
  } catch (e) {
    $('head').textContent = `Tiramisu block: unreachable (${e.message})`
  }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws'
  const ws = new WebSocket(`${proto}://${location.host}/live`)
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data)
    if (msg.type !== 'demo') return
    state = msg.state
    render()
  }
  ws.onclose = () => setTimeout(() => { loadState(); connect() }, 2000)
}

loadState()
pollHead()
setInterval(pollHead, 2000)
connect()
</script>
</body>
</html>
